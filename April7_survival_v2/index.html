<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Game Concept</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Basic CSS Reset */
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        #game-container { width: 100vw; height: 100vh; display: block; }
        canvas { display: block; } /* Remove potential extra space below canvas */
    </style>
</head>
<body>
    <!-- Game Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay Elements -->
    <div id="ui-overlay">
        <!-- Player Stats -->
        <div id="player-stats">
            <div>Health: <span id="health-value">100</span></div>
            <div>Hunger: <span id="hunger-value">100</span></div>
            <div>Stamina: <span id="stamina-value">100</span></div>
        </div>

        <!-- Interaction Prompt -->
        <div id="interaction-prompt">[E] Interact</div>

        <!-- Message Log -->
        <div id="message-log">Welcome!</div>

        <!-- Inventory Menu (Initially Hidden) -->
        <div id="inventory-menu" class="menu-panel">
            <h2>Inventory</h2>
            <ul id="inventory-list">
                <li>Empty</li>
            </ul>
            <p class="menu-hint">Click placeable item to select for placement.</p>
            <p class="menu-hint">Press [I] to close.</p>
        </div>

        <!-- Build Menu (Initially Hidden) -->
        <div id="build-menu" class="menu-panel"> <!-- Ensure this ID is correct -->
            <h2>Craft Buildables</h2>
            <ul> <!-- Make sure the buttons are inside this UL -->
                <!-- Structure -->
                <li><button data-build-id="foundation">Foundation (W:4, S:2)</button></li>
                <li><button data-build-id="wall">Wall (W:2)</button></li>
                <!-- --- NEW STRUCTURE --- -->
                <li><button data-build-id="wall_doorway">Wall w/ Doorway (W:2)</button></li>
                <li><button data-build-id="wall_window">Wall w/ Window (W:2)</button></li>
                <li><button data-build-id="door">Door (W:4)</button></li>
                <!-- --- END NEW STRUCTURE --- -->
                <!-- Stations -->
                <li><button data-build-id="crafting_table">Crafting Table (W:10)</button></li>
                <li><button data-build-id="forge">Forge (S:15, W:5)</button></li>
                <li><button data-build-id="campfire">Campfire (W:5, F:2)</button></li>
            </ul>
             <p class="menu-hint">Click to craft item into inventory.</p>
             <p class="menu-hint">Press [B] to close.</p>
        </div>


        <!-- Quick Bar -->
        <div id="quick-bar">
            <div class="quick-slot" data-slot-index="0"></div>
            <div class="quick-slot" data-slot-index="1"></div>
            <div class="quick-slot" data-slot-index="2"></div>
            <div class="quick-slot" data-slot-index="3"></div>
            <div class="quick-slot" data-slot-index="4"></div>
            <div class="quick-slot" data-slot-index="5"></div>
            <div class="quick-slot" data-slot-index="6"></div>
            <div class="quick-slot" data-slot-index="7"></div>
        </div>

    </div>

    <!-- Libraries -->
    <script src="js/lib/three.min.js"></script>
    <!-- Add other libs like OrbitControls if needed -->

    <!-- Game Scripts (Order Matters!) -->
    <script src="js/constants.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/input.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/crafting.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/interaction.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/world.js"></script>
    <script src="js/building.js"></script> <!-- Building requires Constants, Engine, Input, Inventory, UI, World, Player, AI -->
    <script src="js/main.js"></script>

</body>
</html>
