<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival World</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Three.js Canvas -->
    <canvas id="gameCanvas"></canvas>

     <!-- Error Display -->
     <div id="error-display"></div>

    <!-- UI Elements -->
    <div id="ui-container">
        <!-- Player Stats HUD -->
        <div id="hud">
            <div class="stat-line">
                <span>Health:</span>
                <div class="stat-bar-bg"><div id="health-bar" class="stat-bar health"></div></div>
                <span id="health-value">100 / 100</span>
            </div>
             <div class="stat-line">
                 <span>Hunger:</span>
                 <div class="stat-bar-bg"><div id="hunger-bar" class="stat-bar hunger"></div></div>
                 <span id="hunger-value">100 / 100</span>
             </div>
             <div class="stat-line">
                 <span>Stamina:</span>
                 <div class="stat-bar-bg"><div id="stamina-bar" class="stat-bar stamina"></div></div>
                 <span id="stamina-value">100 / 100</span>
             </div>
        </div>

        <!-- Inventory Panel (Initially Hidden) -->
        <div id="inventory-panel" class="ui-panel hidden">
            <h2>Inventory</h2>
            <div id="inventory-grid"></div>
            <button id="close-inventory-btn" class="close-btn">X</button>
            <!-- Add player equipment slots later -->
        </div>

        <!-- Quick Bar -->
        <div id="quick-bar"></div>

         <!-- Build Menu (Initially Hidden) -->
         <div id="build-menu" class="ui-panel hidden">
            <h2>Build Menu</h2>
             <button id="close-build-menu-btn" class="close-btn">X</button>
            <div id="build-options">
                 <!-- Build options generated by JS -->
            </div>
         </div>

         <!-- Interaction Prompt -->
         <div id="interaction-prompt" class="hidden">Press E to interact</div>

         <!-- Crafting Menus -->
         <div id="workbench-menu" class="ui-panel hidden">Workbench Crafting...</div>
         <div id="forge-menu" class="ui-panel hidden">Forge Smelting...</div>

         <!-- Notifications -->
         <div id="notification-area"></div>

         <!-- Game State Screens -->
         <div id="pause-menu" class="ui-panel hidden">
             <h2>Paused</h2>
             <button id="resume-button">Resume</button>
             <!-- Add Settings, Quit options later -->
         </div>
         <div id="death-screen" class="ui-panel hidden">
             <h2>You Died</h2>
             <button id="respawn-button">Respawn</button>
         </div>

          <!-- Damage Indicator -->
          <div id="damage-indicator"></div>

    </div>

    <!-- Libraries -->
    <script src="js/libs/three.min.js"></script>
	<script src="js/libs/CapsuleGeometry.js"></script>
	
	
	

    <!-- Game Scripts (Order Matters!) -->
    <script src="js/utils.js" defer></script>
    <script src="js/items.js" defer></script>
    <script src="js/input.js" defer></script>
    <script src="js/inventory.js" defer></script>
    <script src="js/crafting.js" defer></script>
    <script src="js/building.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/camera.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/ai.js" defer></script>
    <script src="js/world.js" defer></script>
    <script src="js/main.js" defer></script> <!-- Main entry point last -->
</body>
</html>
