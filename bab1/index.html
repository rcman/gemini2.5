<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon Survival Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="babylon.js"></script>
    <script src="babylonjs.loaders.min.js"></script>
    <script src="babylon.gui.min.js"></script>
</head>
<body>
    <!-- The canvas where the 3D game will render -->
    <canvas id="renderCanvas"></canvas>

    <!-- UI Elements (Overlayed on top of the canvas) -->
    <div id="uiContainer">
        <!-- Quick Bar -->
        <div id="quickBar">
            <div class="slot" id="qb-slot-0"></div>
            <div class="slot" id="qb-slot-1"></div>
            <div class="slot" id="qb-slot-2"></div>
            <div class="slot" id="qb-slot-3"></div>
            <div class="slot" id="qb-slot-4"></div>
            <!-- Add more slots as needed -->
        </div>

        <!-- Inventory Panel (Initially Hidden) -->
        <div id="inventoryPanel" class="hidden">
            <h2>Inventory</h2>
            <div id="inventoryGrid">
                <!-- Slots will be generated by JavaScript -->
            </div>
            <button id="closeInventoryBtn">Close</button>
        </div>

        <!-- Crafting Menu (Initially Hidden) -->
        <div id="craftingMenu" class="hidden">
            <h2>Crafting</h2>
            <ul id="craftingList">
                <!-- Craftable items listed here by JS -->
            </ul>
            <button id="closeCraftingBtn">Close</button>
        </div>

         <!-- Interaction Prompt -->
         <div id="interactionPrompt" class="hidden">Press E to interact</div>

         <!-- Loot Container UI (Initially Hidden) -->
         <div id="lootContainer" class="hidden">
            <h2>Loot</h2>
            <div id="lootGrid"></div>
            <button id="closeLootBtn">Close</button>
         </div>

         <!-- Message Log -->
         <div id="messageLog"></div>

    </div>

    <!-- Link to your main JavaScript file -->
    <script src="game.js"></script>
</body>
</html>
