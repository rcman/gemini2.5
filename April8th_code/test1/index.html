<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival World</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Three.js Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Elements -->
    <div id="ui-container">
        <!-- Player Stats HUD -->
        <div id="hud">
            <div>Health: <span id="health-value">100</span></div>
            <div>Hunger: <span id="hunger-value">100</span></div>
            <div>Stamina: <span id="stamina-value">100</span></div>
        </div>

        <!-- Inventory Panel (Initially Hidden) -->
        <div id="inventory-panel" class="hidden">
            <h2>Inventory</h2>
            <div id="inventory-grid">
                <!-- Inventory slots will be generated by JS -->
            </div>
            <button id="close-inventory-btn">Close (I)</button>
        </div>

        <!-- Quick Bar -->
        <div id="quick-bar">
            <!-- Quick bar slots will be generated by JS -->
        </div>

         <!-- Build Menu (Initially Hidden) -->
         <div id="build-menu" class="hidden">
            <h2>Build Menu</h2>
            <div id="build-options">
                 <!-- Build options generated by JS -->
                 <button data-item="foundation">Foundation</button>
                 <button data-item="wall">Wall</button>
                 <button data-item="wall_window">Wall w/ Window</button>
                 <button data-item="ceiling">Ceiling</button>
                 <button data-item="workbench">Workbench</button>
                 <button data-item="forge">Forge</button>
            </div>
            <button id="close-build-menu-btn">Close (B)</button>
         </div>

         <!-- Interaction Prompt -->
         <div id="interaction-prompt" class="hidden">Press E to interact</div>

         <!-- Crafting Menus (Hidden, structure depends on implementation) -->
         <div id="workbench-menu" class="hidden">Workbench Crafting...</div>
         <div id="forge-menu" class="hidden">Forge Smelting...</div>

    </div>

    <!-- Libraries (Order Matters!) -->
    <script src="js/libs/three.min.js"></script>
    <!-- Add other libs like OrbitControls (optional for dev) or physics engine here -->

    <!-- Game Scripts (Order Matters!) -->
    <script src="js/utils.js"></script>
    <script src="js/items.js"></script>
    <script src="js/input.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/crafting.js"></script>
    <script src="js/building.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/world.js"></script>
    <script src="js/main.js"></script> <!-- Main entry point last -->
</body>
</html>
